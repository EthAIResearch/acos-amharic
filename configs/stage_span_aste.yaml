# Span-ASTE (ACL 2021) Configuration for Amharic ACOS/AOPE
model_name: Davlan/afro-xlmr-base
output_dir: results/stage_span_aste/afroxlmr_run1

data:
  train: data/prepared_explicit/train.jsonl
  dev: data/prepared_explicit/dev.jsonl
  test: data/prepared_explicit/test.jsonl

model:
  max_length: 256
  max_words: 128
  max_span_length: 8       # Paper Section 3.2: L <= 8
  pruning_ratio: 0.5         # Paper Section 3.2: z = 0.5 (top n*z candidates)
  width_dim: 20             # Paper Appendix A: 20-dim span width embedding
  distance_dim: 128         # Paper Appendix A: 128-dim span distance embedding
  hidden_dim: 150           # Paper Appendix A: 150 hidden size for MLPs
  dropout: 0.4              # Paper Appendix A: 0.4 dropout for MLPs
  use_biaffine: true        # Deep Biaffine Attention for relation scoring (Dozat & Manning 2017, Nguyen & Verspoor 2018)
  biaffine_dim: 256         # Biaffine projection dimension
  use_span_sync: true       # Cross-span contextual synchronization (Chen et al. 2020)
  use_span_mean_pooling: true   # Mean-pool internal span tokens [x_s; x_{e-1}; x_mean; f_width]
  use_focal_loss: false         # Set true for Focal Loss, false for Weighted Cross-Entropy
  focal_gamma: 2.0              # Focusing parameter for Focal Loss
  relation_loss_weights: [0.1, 1.0, 1.0, 2.0]  # Downweight INVALID (0.1) vs POS/NEG (1.0) and NEU (2.0)

training:
  batch_size: 4
  epochs: 10
  lr_transformer: 5.0e-5    # Paper Section 3.2: 5e-5 for transformer
  lr_head: 1.0e-3           # Paper Section 3.2: 1e-3 for non-transformer heads
  weight_decay: 0.01        # Paper Section 3.2: 1e-2 for transformer, 0 for heads
  warmup_ratio: 0.1         # Paper Section 3.2: 10% linear warmup
