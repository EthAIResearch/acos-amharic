# Stage 3 — category classification
# Backbone: Multilingual XLM-RoBERTa base (xlm-roberta-base)
# Dataset: Calibrated Gemini-labeled dataset (data/prepared_gemini)

model_name: xlm-roberta-base

data:
  train: data/prepared_gemini/train.jsonl
  test: data/prepared_gemini/test.jsonl
  label_space: data/prepared_gemini/label_space.json
  max_length: 256

training:
  epochs: 10
  batch_size: 16
  lr: 2.0e-5
  warmup_ratio: 0.1
  seed: 42
  class_weight_cap: 15.0

output_dir: results/stage3/xlm_roberta_gemini_run1

notes: >
  Multilingual XLM-RoBERTa-base baseline for Stage 3 category classification on Gemini data.

loss_type: logit_adjustment
logit_adjustment_tau: 1.0
