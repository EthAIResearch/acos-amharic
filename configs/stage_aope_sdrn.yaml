# Joint Aspect-Opinion Pair Extraction (AOPE), SDRN-style
# Replaces Stage 1 (tagging) + Stage 2 (heuristic pairing) with one
# synchronized joint model. See docs/stage_aope_sdrn_analysis.md.

model_name: rasyosef/roberta-base-amharic
num_recurrent_steps: 2       # SDRN paper: best on 3/3 benchmarks, more steps show diminishing returns
relation_threshold: 0.1      # beta in RSM (Eq. 12)
pair_accept_threshold: 0.5   # delta-hat in Eq. 17

data:
  train: data/prepared/train.jsonl
  test: data/prepared/test.jsonl
  max_length: 256

training:
  epochs: 10
  batch_size: 8    # smaller than Stage 1's 16 -- the N x N relation matrix
                    # roughly quadruples memory cost vs. plain tagging
  lr: 2.0e-5
  warmup_ratio: 0.1
  seed: 42
  weight_decay: 0.01
  fp16: true

output_dir: results/stage_aope_sdrn/afroxlmr_base_run1

notes: >
  Evaluates aspect-opinion PAIR F1 directly. Compare against the old
  pipeline's effective pair quality: Stage 1's isolated span F1
  (~0.60 aspect / ~0.46 opinion) chained through Stage 2's heuristic,
  which was only validated at F1=0.993 on GOLD spans -- its performance on
  Stage 1's actual noisy predictions was never measured before Stage 6's
  end-to-end run. This joint model removes that untested link entirely by
  training pairing jointly with extraction from the start.
