# Joint Aspect-Opinion Pair Extraction (AOPE), SDRN-style
# Replaces Stage 1 (tagging) + Stage 2 (heuristic pairing) with one
# synchronized joint model. See docs/stage_aope_sdrn_analysis.md.

model_name: Davlan/afro-xlmr-base
use_crf: true                 # Linear-Chain CRF for structured BIO sequence decoding
num_recurrent_steps: 2       # SDRN paper: best on 3/3 benchmarks, more steps show diminishing returns
relation_threshold: 0.1      # beta in RSM (Eq. 12)
pair_accept_threshold: 0.5   # delta-hat in Eq. 17

data:
  train: data/prepared_explicit/train.jsonl
  dev: data/prepared_explicit/dev.jsonl
  test: data/prepared_explicit/test.jsonl
  max_length: 256

training:
  epochs: 10
  batch_size: 8    # smaller than Stage 1's 16 -- the N x N relation matrix
                    # roughly quadruples memory cost vs. plain tagging
  lr: 2.0e-5
  warmup_ratio: 0.1
  seed: 42
  weight_decay: 0.01
  fp16: true
  bio_class_weights: [1.0, 5.0, 5.0]  # [O, B, I] - boosted from 3.0 to counteract 95% 'O' dominance and lift opinion recall
  span_loss_weight: 3.0               # boosted from 2.0 to give span heads stronger gradient priority vs relation loss

output_dir: results/stage_aope_sdrn/afroxlmr_crf_run1

notes: >
  Trained on data/prepared_explicit with AfroXLMR-base, class-weighted BIO loss,
  and a Linear-Chain CRF layer over aspect and opinion entity heads.
  Enforces syntactic BIO constraints (disallowing O -> I) and performs global
  Viterbi sequence decoding to eliminate fragmented spans and boost opinion recall.
