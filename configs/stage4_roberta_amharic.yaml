# Stage 4 — sentiment classification (NEGATIVE/NEUTRAL/POSITIVE)
# Experiment: Amharic-native RoBERTa baseline (rasyosef/roberta-base-amharic)
model_name: rasyosef/roberta-base-amharic

data:
  train: data/prepared/train.jsonl
  test: data/prepared/test.jsonl
  max_length: 256

training:
  epochs: 10
  batch_size: 16
  lr: 2.0e-5
  warmup_ratio: 0.1
  seed: 42
  class_weight_cap: 15.0
  weight_decay: 0.01
  fp16: true

output_dir: results/stage4/roberta_base_run1

loss_type: logit_adjustment
logit_adjustment_tau: 1.0

notes: >
  Amharic-native RoBERTa-base (110M) pretrained on Amharic mC4/OSCAR corpora.
  Evaluates whether monolingual RoBERTa pretraining improves representation
  quality and minority-class (NEUTRAL ~3.1%) detection compared to multilingual
  AfroXLMR-base and lightweight bert-small-amharic.
