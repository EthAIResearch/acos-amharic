# Stage 4 — sentiment classification (NEGATIVE/NEUTRAL/POSITIVE)
# Backbone: Amharic-native RoBERTa baseline (rasyosef/roberta-base-amharic)
# Dataset: Calibrated Gemini-labeled dataset (data/prepared_gemini)

model_name: rasyosef/roberta-base-amharic

data:
  train: data/prepared_gemini/train.jsonl
  test: data/prepared_gemini/test.jsonl
  max_length: 256

training:
  epochs: 10
  batch_size: 16
  lr: 2.0e-5
  warmup_ratio: 0.1
  seed: 42
  class_weight_cap: 15.0
  weight_decay: 0.01
  fp16: true

output_dir: results/stage4/roberta_gemini_run1

loss_type: logit_adjustment
logit_adjustment_tau: 1.0

notes: >
  Amharic-native RoBERTa-base (110M) for Stage 4 sentiment classification on Gemini-prepared data.
