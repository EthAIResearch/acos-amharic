name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install ruff pytest
      - name: Lint and fix
        run: ruff check src/ tests/ --ignore E501,F401 --fix
      - name: Auto-commit fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: apply automated code formatting with ruff"
          file_pattern: "src/ tests/"
      - name: Run tests
        run: pytest tests/ -v